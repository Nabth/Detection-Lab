# Загружаем модуль Coraza WAF
load_module "/usr/lib/nginx/modules/ngx_http_coraza_module.so";

# Автоматически определяем количество воркеров (по числу ядер CPU)
worker_processes auto;

# Логи самого Nginx (ошибки и access)
error_log /var/log/coraza/error.log warn;
pid /tmp/nginx.pid;

events {
    # Максимальное количество одновременных соединений на один воркер
    worker_connections 1024;
}

http {
    # Скрываем версию Nginx в заголовках Server (защита от fingerprinting)
    server_tokens off;
    # Держим keep-alive соединение 60 секунд
    keepalive_timeout 60s;

    # === ЗАЩИТА L7 (Rate Limiting) ===
    # Ограничение частоты запросов: 1 запрос в секунду на IP (burst обрабатывается отдельно)
    limit_req_zone $binary_remote_addr zone=app_limit:10m rate=20r/s;
    # Ограничение количества одновременных соединений с одного IP (защита от Slowloris)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # === ЗАЩИТА ОТ БОЛЬШИХ POST-ЗАПРОСОВ ===
    # Максимальный размер тела запроса — 10 МБ (защита от переполнения буфера)
    client_max_body_size 10m;
    # Таймаут на чтение тела запроса (защита от медленной отправки)
    client_body_timeout 10s;
    # Таймаут на отправку ответа клиенту
    send_timeout 10s;

    # === WAF (OWASP Coraza) ===
    coraza on;
    coraza_rules_file /opt/coraza/config/coraza-rules.conf;

    # Логи доступа Nginx (для анализа в Wazuh)
    access_log /var/log/coraza/access.log;

    # Бэкенд — наш Apache/DVWA, который мы спрятали на порт 8080
    upstream backend {
        server host.docker.internal:8080;
    }

    # === HTTP -> HTTPS REDIRECT ===
    # Все запросы на 80-й порт принудительно перенаправляем на 443
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # === ОСНОВНОЙ СЕРВЕР (HTTPS) ===
    server {
        listen 443 ssl;
        server_name localhost;
        http2 on;

        # TLS-сертификаты (самоподписанные для лаборатории)
        ssl_certificate /etc/ssl/certs/cert.pem;
        ssl_certificate_key /etc/ssl/certs/key.pem;
        # Разрешаем только современные версии TLS (TLS 1.0/1.1 уязвимы)
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            # === ОГРАНИЧЕНИЕ HTTP-МЕТОДОВ ===
            # Разрешаем только безопасные методы. DELETE, PUT, TRACE и т.д. запрещаем (405)
            if ($request_method !~ ^(GET|POST|HEAD)$) {
                return 405;
            }

            # === ЗАЩИТА L7 (Rate Limiting) ===
            # Применяем лимит из зоны app_limit. burst=1 — разрешаем 1 запрос сверх лимита.
            # nodelay — не ставим в очередь, а сразу отдаем 429.
            limit_req zone=app_limit burst=30 nodelay;
            limit_req_status 429;

            # Ограничение одновременных соединений с одного IP
            limit_conn conn_limit 20;
            limit_conn_status 429;

            # === SECURITY HEADERS ===
            # Защита от кликджекинга (запрет встраивания в iframe)
            add_header X-Frame-Options "DENY" always;
            # Запрет на MIME-sniffing (браузер не будет угадывать тип контента)
            add_header X-Content-Type-Options "nosniff" always;
            # HSTS — заставляем браузер использовать только HTTPS в течение года
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            # === ПРОКСИРОВАНИЕ НА БЭКЕНД (Apache/DVWA) ===
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
