load_module "/usr/lib/nginx/modules/ngx_http_coraza_module.so";

worker_processes auto;
error_log /var/log/coraza/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    keepalive_timeout 60s;
    
    limit_req_zone $binary_remote_addr zone=app_limit:10m rate=1r/s;

    coraza on;
    coraza_rules_file /opt/coraza/config/coraza-rules.conf;
    access_log /var/log/coraza/access.log;

    upstream backend {
        server 192.168.56.20:8080;
    }

    # --- HTTP to HTTPS Redirect ---
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;
        http2 on;

        ssl_certificate /etc/ssl/certs/cert.pem;
        ssl_certificate_key /etc/ssl/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            limit_req zone=app_limit burst=1 nodelay;
            limit_req_status 429;
            
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
