# Custom WAF Rules for Evasion Detection

# 1. Obfuscated SQL Injection (comment-based)
SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_FILENAME|ARGS|ARGS_NAMES|REQUEST_HEADERS|XML:/*|REQUEST_BODY "@rx (?i)(?:union(?:\s|/\*.*?\*/)+select|select(?:\s|/\*.*?\*/)+.*?from)" \
"id:10001,phase:2,deny,status:403,log,msg:'Custom Rule: Obfuscated SQL Injection (comment-based)'"

# 2. Double URL Encoding Detection
SecRule REQUEST_URI|REQUEST_BODY|ARGS "@rx %25(?:27|22|3C|3E|2F|5C)" \
"id:10002,phase:1,deny,status:403,log,msg:'Custom Rule: Double URL Encoding Detected'"

# 3. Excessive SQL Comments (tamper script indicator)
SecRule ARGS "@rx (?i)(\/\*.*?\*\/){3,}" \
"id:10003,phase:2,deny,status:403,log,msg:'Custom Rule: Excessive SQL Comments (possible tamper script)'"

# 4. SQLMap User-Agent
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)sqlmap" \
"id:10004,phase:1,deny,status:403,log,msg:'Custom Rule: SQLMap Scanner Detected'"

# Перенаправляем логи аудита WAF в файл
SecAuditLog /var/log/coraza/audit/audit.log
